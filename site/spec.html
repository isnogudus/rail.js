<script type="module">
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@14/lib/marked.esm.js';

const SLUG_DUP = new Map();
function slugify(text) {
  const base = String(text)
    .toLowerCase()
    .replace(/[`*_~]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'section';
  const n = (SLUG_DUP.get(base) ?? 0) + 1;
  SLUG_DUP.set(base, n);
  return n === 1 ? base : `${base}-${n - 1}`;
}

// Walk the rendered DOM and rewrite heading ids deterministically so
// the TOC anchors match what's actually rendered.
function rewriteHeadings(root) {
  const headings = [];
  for (const h of root.querySelectorAll('h1, h2, h3')) {
    const id = slugify(h.textContent);
    h.id = id;
    const level = Number(h.tagName.slice(1));
    headings.push({ id, level, text: h.textContent });
  }
  return headings;
}

function buildToc(headings) {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  for (const h of headings) {
    if (h.level === 1) continue;     // skip the document title
    const a = document.createElement('a');
    a.href = `#${h.id}`;
    a.textContent = h.text;
    a.className = `lvl-${h.level}`;
    toc.appendChild(a);
  }
}

function setupScrollSpy(headings) {
  const links = new Map();
  for (const a of document.querySelectorAll('.spec-toc a')) {
    links.set(a.getAttribute('href').slice(1), a);
  }
  const observer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) {
        for (const a of links.values()) a.classList.remove('active');
        const link = links.get(e.target.id);
        if (link) link.classList.add('active');
      }
    }
  }, { rootMargin: '-80px 0px -75% 0px' });
  for (const h of headings) {
    const el = document.getElementById(h.id);
    if (el && h.level !== 1) observer.observe(el);
  }
}

async function loadSpec() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('./rail-spec.md');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    marked.setOptions({ gfm: true, breaks: false });
    const html = marked.parse(md);
    content.classList.remove('spec-loading');
    content.innerHTML = html;
    const headings = rewriteHeadings(content);
    buildToc(headings);
    setupScrollSpy(headings);

    // If the page was opened with a hash, scroll there after render.
    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView({ behavior: 'instant', block: 'start' });
    }
  } catch (e) {
    content.classList.remove('spec-loading');
    content.innerHTML = `<div class="spec-error">Could not load spec: ${e.message}.
      The markdown source lives at <code>docs/rail-spec.md</code>; on the deployed site it is
      copied next to this page by <code>npm run site:sync</code>.</div>`;
  }
}

loadSpec();
</script>
